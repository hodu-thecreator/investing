name: Daily Investment Report

on:
  schedule:
    # 미국 장 오픈 후 30분 (10:00 ET) — DST 자동 처리 위해 두 개 모두 등록
    # 코드에서 ET 시간 체크 후 한 쪽만 실제 발송
    - cron: "0 14 * * 1-5"  # EDT 기간 (3월~11월): 14:00 UTC = 10:00 EDT
    - cron: "0 15 * * 1-5"  # EST 기간 (11월~3월): 15:00 UTC = 10:00 EST
  workflow_dispatch:  # 수동 실행 버튼 (시간 체크 무시)

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCH_STOCKS: ${{ secrets.WATCH_STOCKS }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          # workflow_dispatch에서 실행 시 시간 체크 무시
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python daily_report.py
