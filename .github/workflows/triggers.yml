name: Market Trigger Monitor

on:
  schedule:
    # 미국 장 시간(EDT 9-17 ET, EST 8-16 ET 모두 커버) 30분마다
    # 13:00~21:00 UTC = EDT 9:00~17:00 / EST 8:00~16:00
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Restore trigger state
        uses: actions/cache@v4
        with:
          path: .trigger_state.json
          key: trigger-state-${{ github.run_id }}
          restore-keys: |
            trigger-state-

      - name: Run trigger check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python triggers.py

      - name: Save trigger state
        uses: actions/cache@v4
        if: always()
        with:
          path: .trigger_state.json
          key: trigger-state-${{ github.run_id }}
